id = "dxle/layout-menu"
name = "Layout"
version = "1.0.0"
plugin_api = 26
author = "dxle"
license = "MIT"
icon = "layout-dashboard"
description = "Choose a Hyprland layout."
tags = ["hyprland", "layout"]

[[setting]]
key = "provider_enabled"
type = "bool"
label_key = "settings.provider.enabled"
description_key = "settings.provider.enabled.description"
default = true

[[setting]]
key = "provider_prefix"
type = "string"
label_key = "settings.provider.prefix"
description_key = "settings.provider.prefix.description"
default = "layout"

[[setting]]
key = "provider_global"
type = "bool"
label_key = "settings.provider.global"
description_key = "settings.provider.global.description"
default = false

[[widget]]
id = "switcher"
entry = "switcher.luau"

  [widget.actions]
  left = "panel-toggle launcher >layout"

  [[widget.setting]]
  key = "label"
  type = "string"
  label_key = "settings.widget.label"
  default = "Layout"

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.widget.glyph"
  default = "layout-dashboard"

[[panel]]
id = "menu"
entry = "menu.luau"
width = 700
height = 480
placement = "attached"
position = "auto"
open_near_click = false

  [[panel.setting]]
  key = "menu_width"
  type = "int"
  label_key = "settings.panel.width"
  description_key = "settings.panel.width.description"
  default = 700
  min = 600
  max = 1200
  step = 10

[[launcher_provider]]
id = "layout"
entry = "providers.luau"
prefix = "layout"
glyph = "layout-dashboard"
