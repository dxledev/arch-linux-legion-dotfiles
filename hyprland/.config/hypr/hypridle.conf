general {
    lock_cmd = $HOME/bin/system-lock --wait       # route to the active shell's lock screen.
    before_sleep_cmd = $HOME/bin/system-lock --wait
    after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display.
    inhibit_sleep = 0
}

listener {
    timeout = 1200                                 # 20min
    ignore_inhibit = false
    on-timeout = $HOME/bin/system-lock --wait     # lock screen when timeout has passed
}

